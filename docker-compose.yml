services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: health_fusion
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data/
  web:
    build:
      context: .
    # image: 
    ports:
      - "8080:8080"
    volumes:
      - ./data/web:/app/data
    restart: unless-stopped
    depends_on:
      - db
volumes:
  db_data:
  web_data:
